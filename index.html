<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>アイカツ！アンコール カード所持管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>アイカツ！アンコール<br>カード所持管理</h1>
  <div class="actions">
    <button id="clearBtn" class="btn danger">すべてクリア</button>
    <a id="shareBtn" class="x-share-btn" href="#" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
      <span>投稿する</span>
    </a>
  </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="all">すべて</button>
    <button class="tab" data-tab="1">1弾</button>
    <button class="tab" data-tab="promo">プロモーション</button>
  </nav>

  <div class="stats">
    所持：<span id="ownedCount">0</span> / <span id="totalCount">0</span> 枚
  </div>

  <main id="cardGrid" class="card-grid"></main>

  <script src="cards.js"></script>
  <script src="app.js"></script>

</body>
</html>

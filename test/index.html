<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>アイカツ！アンコール カード所持率チェッカー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>
      アイカツ！アンコール<br>
      カード所持率チェッカー
    </h1>

    <div class="actions">
      <button id="clearBtn" class="btn danger" type="button">
        すべてクリア
      </button>

      <button id="saveImageBtn" class="btn save" type="button">
        画像で保存
      </button>

      <a
        id="shareBtn"
        class="x-share-btn"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.359-7.006L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"></path>
        </svg>
        <span>投稿する</span>
      </a>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="all" type="button">
      すべて
    </button>
    <button class="tab" data-tab="1" type="button">
      1弾
    </button>
    <button class="tab" data-tab="promo" type="button">
      プロモーション
    </button>
  </nav>

  <div class="stats-row">
    <button
      id="settingsToggleBtn"
      class="settings-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="displaySettingsPanel"
    >
      <span class="settings-toggle-label">表示</span>

      <span class="settings-toggle-icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          width="24"
          height="24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m6 9 6 6 6-6"></path>
        </svg>
      </span>
    </button>

    <div class="stats">
      所持：
      <span id="ownedCount">0</span>
      /
      <span id="totalCount">0</span>
      種
      （<span id="ownedPercentage">0</span>%）
    </div>
  </div>

  <section
    id="displaySettingsPanel"
    class="settings-panel"
    hidden
  >
    <div class="settings-group">
      <h2>♦ カードサイズ</h2>
      <div class="settings-options settings-options-two">
        <button
          type="button"
          class="choice-btn"
          data-setting="size"
          data-value="large"
          aria-pressed="true"
        >大</button>

        <button
          type="button"
          class="choice-btn"
          data-setting="size"
          data-value="small"
          aria-pressed="false"
        >小</button>
      </div>
    </div>

    <div class="settings-group">
      <h2>♦ パラレルカード</h2>
      <div class="settings-options settings-options-two">
        <button
          type="button"
          class="choice-btn"
          data-setting="parallel"
          data-value="show"
          aria-pressed="false"
        >表示</button>

        <button
          type="button"
          class="choice-btn"
          data-setting="parallel"
          data-value="hide"
          aria-pressed="true"
        >非表示</button>
      </div>
    </div>

    <div class="settings-group">
      <h2>♦ 所持枚数</h2>
      <div class="settings-options">
        <button
          type="button"
          class="choice-btn"
          data-setting="count"
          data-value="all"
          aria-pressed="true"
        >すべて</button>

        <button
          type="button"
          class="choice-btn"
          data-setting="count"
          data-value="0"
          aria-pressed="true"
        >0枚</button>

        <button
          type="button"
          class="choice-btn"
          data-setting="count"
          data-value="1"
          aria-pressed="true"
        >1枚</button>

        <button
          type="button"
          class="choice-btn"
          data-setting="count"
          data-value="2"
          aria-pressed="true"
        >2枚</button>

        <button
          type="button"
          class="choice-btn"
          data-setting="count"
          data-value="3plus"
          aria-pressed="true"
        >3枚以上</button>
      </div>
    </div>

    <div class="settings-group">
      <h2>♦ レアリティ</h2>
      <div class="settings-options">
        <button
          type="button"
          class="choice-btn"
          data-setting="rarity"
          data-value="all"
          aria-pressed="true"
        >すべて</button>

        <button
          type="button"
          class="choice-btn"
          data-setting="rarity"
          data-value="PR"
          aria-pressed="true"
        >PR</button>

        <button
          type="button"
          class="choice-btn"
          data-setting="rarity"
          data-value="R"
          aria-pressed="true"
        >R</button>

        <button
          type="button"
          class="choice-btn"
          data-setting="rarity"
          data-value="N"
          aria-pressed="true"
        >N</button>

        <button
          type="button"
          class="choice-btn"
          data-setting="rarity"
          data-value="ER"
          aria-pressed="true"
        >ER</button>
      </div>
    </div>

    <div class="settings-group">
      <h2>♦ 未所持カードの表示</h2>
      <div class="settings-options settings-options-two">
        <button
          type="button"
          class="choice-btn"
          data-setting="unowned"
          data-value="gray"
          aria-pressed="true"
        >グレー</button>

        <button
          type="button"
          class="choice-btn"
          data-setting="unowned"
          data-value="color"
          aria-pressed="false"
        >カラー</button>
      </div>
    </div>
  </section>

  <main id="cardGrid" class="card-grid"></main>

  <script src="cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
